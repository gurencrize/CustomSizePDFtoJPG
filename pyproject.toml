[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2jpg"
version = "0.1.0"
description = "PDF のページを任意のサイズの JPG 画像に変換するツール"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pdf2jpg = "pdf2jpg.cli:main"

[tool.setuptools.packages.find]
include = ["pdf2jpg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
